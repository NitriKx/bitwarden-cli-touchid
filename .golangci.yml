version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - gosec
  settings:
    gosec:
      excludes:
        # G401/G505: The Bitwarden desktop IPC protocol mandates RSA-OAEP
        # with SHA-1 for the shared-secret exchange (client.go). Not a choice.
        - G401
        - G505
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Tests may use weak keys/short inputs on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
