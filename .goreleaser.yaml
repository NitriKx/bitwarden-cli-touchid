version: 2

project_name: bwbio

builds:
  - id: bwbio
    main: .
    binary: bwbio
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: bwbio
    formats: [tar.gz]
    # Windows users expect .zip
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  # release-please owns the changelog (CHANGELOG.md and the release notes).
  disable: true

release:
  # The workflow now runs goreleaser on tag push, after release-please has
  # published the release (publishing a release pushes its tag). Adopt the
  # existing published release, upload binaries, and keep its notes.
  use_existing_draft: true
  mode: keep-existing
  replace_existing_artifacts: true

sboms:
  - artifacts: archive
