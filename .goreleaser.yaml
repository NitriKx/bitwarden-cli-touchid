version: 2

project_name: bwbio

builds:
  - id: bwbio
    main: .
    binary: bwbio
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: bwbio
    formats: [tar.gz]
    # Windows users expect .zip
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  id: checksums
  name_template: "checksums.txt"

changelog:
  # release-please owns the changelog (CHANGELOG.md and the release notes).
  disable: true

# The Release workflow runs goreleaser on tag push. By then the release is
# already published (the tag exists and the release is live). We disable the
# built-in release pipe and upload artifacts via a custom step in CI instead,
# because goreleaser's release pipe tries to PATCH the release (which fails
# on published/immutable releases with "tag_name already_exists").
release:
  disable: true

sboms:
  - id: sboms
    artifacts: archive
