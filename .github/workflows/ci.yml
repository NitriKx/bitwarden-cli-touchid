name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (build, vet, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: CGO_ENABLED=0 go build -o bwbio .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The golangci-lint pre-commit hook uses language: system, so the
      # binary must be on PATH.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  conventions:
    name: Commit conventions
    # PR-only. release-please's Release PR commits are bot-authored; the
    # semantic-title check would fail on "chore(main): release X.Y.Z" and
    # prettier would fight its CHANGELOG formatting — and we merge that PR
    # manually anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Validate PR title (becomes the squash-merge commit message)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # The release PR title "chore(main): release X.Y.Z" is conventional;
          # scope is optional here because commitlint enforces the full config
          # (including scopes) on the individual commits below.
          validateSingleCommit: false

      - name: Commitlint (all commits in the PR)
        run: |
          # Install into a scratch dir OUTSIDE the repo: commitlint resolves
          # `extends` relative to the config file's directory, and the repo
          # has no package.json, so installing in-repo fails to resolve
          # @commitlint/config-conventional.
          CL_DIR="$RUNNER_TEMP/commitlint"
          mkdir -p "$CL_DIR"
          npm install --prefix "$CL_DIR" --no-save --silent \
            @commitlint/cli @commitlint/config-conventional
          # Copy the config into the scratch dir so `extends` resolves against
          # the installed node_modules. commitlint still needs to run from the
          # repo root (it shells out to git), so pass absolute paths.
          cp .commitlintrc.json "$CL_DIR/.commitlintrc.json"
          npx --prefix "$CL_DIR" commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "$GITHUB_SHA" \
            --config "$CL_DIR/.commitlintrc.json"

  release-check:
    name: Release config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      # syft is required by the goreleaser SBOM pipe (and healthcheck).
      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@latest

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: check

      - name: goreleaser healthcheck
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: healthcheck

      - name: Snapshot build (all platforms, no publish)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --snapshot --clean --skip=publish
