name: Release

# release-please maintains a standing Release PR on main. Merging it (manually)
# creates the vX.Y.Z tag and a DRAFT GitHub release; the goreleaser job below
# then adopts the draft, uploads binaries, and publishes it.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run (e.g. after fixing the RELEASE_PLEASE_TOKEN)

permissions:
  contents: read

jobs:
  # Secrets can't be referenced in job-level `if` conditionals, so a gate job
  # exposes the presence of RELEASE_PLEASE_TOKEN as an output. Until the
  # secret is added (see CONTRIBUTING.md), release jobs skip cleanly instead of
  # failing every push to main.
  release-token-gate:
    name: Check release token
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_PLEASE_TOKEN is not set; release-please is disabled. See CONTRIBUTING.md."
          fi

  release-please:
    name: Release Please
    needs: release-token-gate
    if: needs.release-token-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + draft release
      pull-requests: write # open/maintain the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        # PAT, not GITHUB_TOKEN: a bot-authored Release PR under the default
        # token never runs CI (workflows need manual approval), which would
        # block the required-checks gate when merging the Release PR.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  goreleaser:
    name: Build and attach release artifacts
    needs: [release-token-gate, release-please]
    if: needs.release-token-gate.outputs.configured == 'true' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload artifacts to the draft release
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # goreleaser derives the version from the tag on HEAD.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Sanity check on the tagged commit
        run: go test ./...

      # syft is required by the goreleaser SBOM pipe.
      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@latest

      - name: Publish binaries to the draft release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
